
<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Astera Siparis ve Katalog Paneli</title>
<style>
:root{
  --bg:#edf4f8;--card:#fff;--line:#c4d3dd;--text:#18384f;--muted:#60798c;
  --brand:#1d5279;--green:#2e6f52;--soft:#e6f0f6;--accent:#4f8db5;--danger:#b24d3f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#edf4f8 0%,#f5f9fc 100%);color:var(--text)}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid rgba(100,155,195,.22);border-radius:20px;box-shadow:0 8px 32px rgba(29,82,121,.07);overflow:hidden}
.head{padding:20px 22px;border-bottom:1px solid rgba(100,155,195,.18);display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#1d5279 0%,#2d7ab5 100%)}
.logo-wrap img{height:78px;max-width:220px;object-fit:contain}
.logo-fb{width:72px;height:72px;border-radius:16px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;border:2px solid rgba(255,255,255,.35)}
.head-text{color:#fff}
.head-title{font-size:26px;font-weight:900}
.head-sub{font-size:14px;font-weight:600;opacity:.8;margin-top:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid rgba(100,155,195,.18);background:#f8fbfd}
.tab-btn{padding:10px 14px;border:none;border-radius:999px;background:#e8f1f7;color:var(--muted);font-weight:800;cursor:pointer}
.tab-btn.active{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff}
.content{padding:18px}
.order-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media(max-width:980px){.order-grid{grid-template-columns:1fr}}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.fg input,.fg select,.fg textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus,.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,141,181,.12)}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:#f8fbfd;cursor:pointer;font-size:14px;font-weight:600}
.invoice-grid{display:none;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.invoice-grid.open{display:grid}
.search-wrap{margin-top:14px;position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;padding:11px 14px 11px 36px;border:1.5px solid var(--line);border-radius:12px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pill{padding:9px 14px;border:none;background:#eef5fa;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border-radius:999px}
.pill.active{color:#fff;background:linear-gradient(135deg,var(--brand),var(--accent))}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.product{background:#fff;border:1.5px solid rgba(100,155,195,.2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.product.out{opacity:.72;border-color:rgba(178,77,63,.28)}
.prod-img-wrap{width:100%;height:130px;border-radius:12px;background:linear-gradient(135deg,#f2f8fc,#e8f2f8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.prod-img-placeholder{font-size:34px;opacity:.3}
.prod-name{font-weight:800;font-size:14px;line-height:1.35}
.prod-meta{font-size:12px;color:var(--muted);line-height:1.6}
.stock-ok{font-size:12px;font-weight:700;color:var(--green)}
.stock-out{font-size:12px;font-weight:700;color:var(--danger)}
.prod-price{font-size:22px;font-weight:900;color:var(--brand)}
.prod-price small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:auto}
.qty-input{width:64px;padding:8px 6px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;text-align:center}
.btn{border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;font-size:13px}
.btn-brand{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff}
.btn-sec{background:#fff;border:1.5px solid var(--line);color:var(--muted)}
.btn-danger{background:#fff0ee;border:1.5px solid rgba(178,77,63,.25);color:var(--danger)}
.btn-wa{background:linear-gradient(135deg,#25D366,#1da851);color:#fff}
.empty-msg{text-align:center;padding:40px 20px;color:var(--muted);border:2px dashed rgba(100,155,195,.25);border-radius:16px;background:rgba(255,255,255,.6)}
.cart-sticky{position:sticky;top:16px}
.cart-head{padding:18px 20px;border-bottom:1px solid rgba(100,155,195,.18);display:flex;align-items:center;justify-content:space-between}
.cart-title{font-size:18px;font-weight:900}
.cart-count{font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);padding:3px 10px;border-radius:99px}
.cart-body{padding:16px 18px}
.cart-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.cart-item{padding:10px 12px;border:1px solid rgba(100,155,195,.18);border-radius:12px;background:linear-gradient(180deg,#fcfeff,#f4f8fb)}
.cart-item-name{font-weight:800;font-size:13px}
.cart-item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.cart-item-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cart-item-price{font-weight:800;font-size:14px;color:var(--brand)}
.btn-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:18px;padding:2px 4px;line-height:1}
.summary{margin-top:14px;padding:16px;border:1px solid rgba(100,155,195,.2);border-radius:16px;background:linear-gradient(180deg,#f8fbfd,#edf4f8)}
.sum-row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:7px 0;border-top:1px solid rgba(100,155,195,.15)}
.sum-row:first-child{border-top:none;padding-top:0}
.sum-grand{padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.sum-grand-val{font-size:22px;font-weight:900}
.admin-layout{display:grid;gap:16px}
.split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid rgba(100,155,195,.18);font-size:13px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.mono{font-family:Consolas,monospace}
.status{margin-top:10px;font-size:13px;color:var(--muted)}
.login-box{max-width:420px;margin:24px auto}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}
.badge.ok{background:#e9f7f0;color:var(--green)}
.badge.no{background:#fff0ee;color:var(--danger)}
@media(max-width:720px){
  body{font-size:15px}
  .wrap{padding:10px}
  .card{border-radius:16px}
  .head{padding:16px;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .logo-wrap img{height:56px;max-width:160px}
  .logo-fb{width:56px;height:56px;font-size:22px;border-radius:14px}
  .head-title{font-size:20px;line-height:1.15}
  .head-sub{font-size:12px}
  .nav{padding:10px 12px;gap:6px;overflow-x:auto;flex-wrap:nowrap;-ms-overflow-style:none;scrollbar-width:none}
  .nav::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .tab-btn,.pill{white-space:nowrap;flex:0 0 auto}
  .content{padding:12px}
  .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .product{padding:12px}
  .prod-img-wrap{height:112px}
  .qty-row{flex-direction:column;align-items:stretch}
  .qty-input{width:100%}
  .btn{width:100%;justify-content:center}
  .toolbar .btn{width:auto}
  .cart-sticky{position:static}
  .cart-head{padding:16px}
  .cart-body{padding:14px}
  .cart-list{max-height:none}
  .sum-grand{flex-wrap:wrap;gap:10px}
  .login-box{margin:12px auto}}
@media(max-width:560px){
  .wrap{padding:8px}
  .content{padding:10px}
  .form-grid,.invoice-grid{grid-template-columns:1fr}
  .products{grid-template-columns:1fr}
  .prod-price{font-size:20px}
  .check-row{align-items:flex-start}
  .sum-grand{flex-direction:column;align-items:flex-start}
  th,td{padding:8px 6px;font-size:12px}
}
</style>

  function collectProductForm(){return normalizeProduct({id:(g("pf_id").value||"").trim()||uid(),groupKey:g("pf_group").value,type:g("pf_type").value,name:g("pf_name").value,mann:g("pf_mann").value,oem:g("pf_oem").value,price:g("pf_price").value,stokAdet:g("pf_stokAdet").value,stock:g("pf_stock").checked,img:g("pf_img").value,modeller:g("pf_modeller").value,active:g("pf_active").checked})}
  function saveProductForm(){var product=collectProductForm();if(!product.name.trim()){alert("Urun adi zorunlu.");return;}removeProductById(product.id,true);state.catalog[product.groupKey].cats[product.type].push(product);productFormState=blankProduct();render();}
  function removeProductById(id,silent){groups().forEach(function(groupKey){DEFAULT_TYPES.forEach(function(type){state.catalog[groupKey].cats[type]=state.catalog[groupKey].cats[type].filter(function(product){return product.id!==id;});});});delete cart[id];if(!silent)render();}
  function deleteProduct(id){if(!confirm("Urun silinsin mi?"))return;removeProductById(id);}
  function loadProductIntoForm(id){var product=allProducts().find(function(item){return item.id===id;});if(!product)return;productFormState=deepClone(product);currentTab="Katalog Yönetimi";render();}
  function renderGroupsTab(){
    g("content").innerHTML="<div class='admin-layout split'><div class='card'><div class='cart-head'><div class='cart-title'>Yeni Grup</div></div><div class='cart-body'><div class='fg'><label>Grup Kodu</label><input id='newGroupKey' placeholder='BMW'></div><div class='fg'><label>Grup Adi</label><input id='newGroupLabel' placeholder='BMW Grubu'></div><div class='fg'><label>Alt Baslik</label><input id='newGroupSub' placeholder='BMW · Mini'></div><div class='toolbar' style='margin-top:12px'><button class='btn btn-brand' id='addGroupBtn'>Grup Ekle</button></div></div></div><div class='card'><div class='cart-head'><div class='cart-title'>Mevcut Gruplar</div></div><div class='cart-body table-wrap'><table><thead><tr><th>Kod</th><th>Ad</th><th>Alt Baslik</th><th>Urun</th><th></th></tr></thead><tbody>"+groups().map(function(groupKey){var count=DEFAULT_TYPES.reduce(function(sum,type){return sum+(state.catalog[groupKey].cats[type]||[]).length;},0);return "<tr><td class='mono'>"+esc(groupKey)+"</td><td><input data-group-label='"+esc(groupKey)+"' value='"+esc(state.catalog[groupKey].label)+"'></td><td><input data-group-sub='"+esc(groupKey)+"' value='"+esc(state.catalog[groupKey].subtitle||"")+"'></td><td>"+count+"</td><td><div class='toolbar'><button class='btn btn-sec' data-group-save='"+esc(groupKey)+"'>Kaydet</button><button class='btn btn-danger' data-group-del='"+esc(groupKey)+"'>Sil</button></div></td></tr>";}).join("")+"</tbody></table></div></div></div>";
    g("addGroupBtn").onclick=function(){var key=(g("newGroupKey").value||"").toUpperCase().trim();if(!key){alert("Grup kodu zorunlu.");return;}if(state.catalog[key]){alert("Bu grup zaten var.");return;}state.catalog[key]={label:(g("newGroupLabel").value||key).trim(),subtitle:(g("newGroupSub").value||"").trim(),cats:ensureCats({})};render();};
    Array.prototype.forEach.call(document.querySelectorAll("[data-group-save]"),function(btn){btn.onclick=function(){var key=this.getAttribute("data-group-save");state.catalog[key].label=document.querySelector("[data-group-label='"+key+"']").value.trim()||key;state.catalog[key].subtitle=document.querySelector("[data-group-sub='"+key+"']").value.trim();render();};});
    Array.prototype.forEach.call(document.querySelectorAll("[data-group-del]"),function(btn){btn.onclick=function(){var key=this.getAttribute("data-group-del");var count=DEFAULT_TYPES.reduce(function(sum,type){return sum+(state.catalog[key].cats[type]||[]).length;},0);if(count&&!confirm("Bu grupta urunler var. Yine de silinsin mi?"))return;delete state.catalog[key];if(!groups().length)state.catalog.GENEL={label:"Genel",subtitle:"",cats:ensureCats({})};ensureSelection();render();};});
  }
  function renderPriceStockTab(){
    var rows=allProducts();
    g("content").innerHTML="<div class='card'><div class='cart-head'><div class='cart-title'>Fiyat / Stok Yonetimi</div></div><div class='cart-body table-wrap'><table><thead><tr><th>Urun</th><th>Grup</th><th>Tur</th><th>Fiyat</th><th>Stok Adet</th><th>Stok</th><th>Aktif</th><th></th></tr></thead><tbody>"+(rows.length?rows.map(function(product){return "<tr><td><strong>"+esc(product.name||"-")+"</strong><div class='mono'>"+esc(product.mann||product.id)+"</div></td><td>"+esc(product.groupKey)+"</td><td>"+esc(product.type)+"</td><td><input data-price='"+esc(product.id)+"' type='number' step='0.01' value='"+esc(product.price)+"'></td><td><input data-qty='"+esc(product.id)+"' type='number' value='"+esc(product.stokAdet)+"'></td><td><input data-stock='"+esc(product.id)+"' type='checkbox'"+(product.stock?" checked":"")+"></td><td><input data-active='"+esc(product.id)+"' type='checkbox'"+(product.active?" checked":"")+"></td><td><button class='btn btn-brand' data-fast-save='"+esc(product.id)+"'>Kaydet</button></td></tr>";}).join(""):"<tr><td colspan='8'>Urun yok.</td></tr>")+"</tbody></table></div></div>";
    Array.prototype.forEach.call(document.querySelectorAll("[data-fast-save]"),function(btn){btn.onclick=function(){var id=this.getAttribute("data-fast-save"),product=allProducts().find(function(item){return item.id===id;});if(!product)return;product.price=parseFloat(document.querySelector("[data-price='"+id+"']").value||0)||0;product.stokAdet=parseInt(document.querySelector("[data-qty='"+id+"']").value,10)||0;product.stock=!!document.querySelector("[data-stock='"+id+"']").checked;product.active=!!document.querySelector("[data-active='"+id+"']").checked;render();};});
  }
  function renderSettingsTab(){
    g("content").innerHTML="<div class='card'><div class='cart-head'><div class='cart-title'>Genel Ayarlar</div></div><div class='cart-body'><div class='form-grid'><div class='fg'><label>Baslik</label><input id='st_title' value='"+esc(state.settings.title)+"'></div><div class='fg'><label>Alt Baslik</label><input id='st_subtitle' value='"+esc(state.settings.subtitle)+"'></div></div><div class='form-grid'><div class='fg'><label>WhatsApp</label><input id='st_wa' value='"+esc(state.settings.wa)+"'></div><div class='fg'><label>Logo URL</label><input id='st_logo' value='"+esc(state.settings.logo)+"'></div></div><div class='fg'><label>Yonetici Sifresi</label><input id='st_adminPass' type='password' value='"+esc(state.settings.adminPassword)+"'></div><div class='toolbar' style='margin-top:12px'><button class='btn btn-brand' id='saveSettingsBtn'>Kaydet</button></div></div></div>";
    g("saveSettingsBtn").onclick=function(){state.settings.title=g("st_title").value.trim()||state.settings.title;state.settings.subtitle=g("st_subtitle").value.trim();state.settings.wa=normalizePhone(g("st_wa").value||"");state.settings.logo=g("st_logo").value.trim();state.settings.adminPassword=g("st_adminPass").value||"1234";render();};
  }
  function downloadJson(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="katalog-yedek.json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
  function exportCurrentHtml(){var html=document.documentElement.outerHTML.replace(/window\.__SIPARIS_KATALOG_STATE__=\{[\s\S]*?\};/,function(){return "window.__SIPARIS_KATALOG_STATE__="+JSON.stringify(state)+";";}),blob=new Blob(["<!DOCTYPE html>\n"+html],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="siparis-katalog-paneli.html";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
  function renderBackupTab(){
    g("content").innerHTML="<div class='admin-layout split'><div class='card'><div class='cart-head'><div class='cart-title'>Yedekleme</div></div><div class='cart-body'><div class='toolbar'><button class='btn btn-brand' id='downloadJsonBtn'>katalog-yedek.json indir</button><button class='btn btn-sec' id='downloadHtmlBtn'>Guncel Panel HTML Indir</button></div><div class='status'>Mevcut katalog ve ayarlarinizi JSON veya tam HTML olarak disa aktarabilirsiniz.</div></div></div><div class='card'><div class='cart-head'><div class='cart-title'>Yukleme</div></div><div class='cart-body'><div class='fg'><label>JSON Dosyasi Yukle</label><input id='jsonImport' type='file' accept='application/json'></div><div class='status'>Yuklenen dosya aninda bu panele uygulanir.</div></div></div></div>";
    g("downloadJsonBtn").onclick=downloadJson;
    g("downloadHtmlBtn").onclick=exportCurrentHtml;
    g("jsonImport").onchange=function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{state=normalizeState(JSON.parse(reader.result));activeGroup="";activeType="";productFormState=blankProduct();cart={};render();}catch(err){alert("JSON dosyasi okunamadi.");}};reader.readAsText(file,"utf-8");};
  }
  function render(){
    ensureSelection();
    renderHeader();
    renderTabs();
    renderAdminAccess();
    if(currentTab==="Siparis Ver")return renderOrderTab();
    if(currentTab==="Yonetici Girisi")return renderAdminGate();
    if(!adminUnlocked()){
      currentTab="Yonetici Girisi";
      renderTabs();
      renderAdminAccess();
      return renderAdminGate();
    }
    if(currentTab==="Katalog Yönetimi")return renderProductManager();
    if(currentTab==="Gruplar")return renderGroupsTab();
    if(currentTab==="Fiyat / Stok")return renderPriceStockTab();
    if(currentTab==="Ayarlar")return renderSettingsTab();
    if(currentTab==="Yedekle / Yükle")return renderBackupTab();
    currentTab="Siparis Ver";
    return renderOrderTab();
  }
  clearOldStorageVersions();
  customerForm=normalizeCustomerForm(loadCustomerProfile());
  invoiceOpen=!!customerForm.wantInvoice;
  applyVersionToUrl();
  render();
})();
</script>
