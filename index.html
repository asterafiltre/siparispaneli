async function appendOrderToCloud(cfg,order){if(!cloudReady(cfg))return false;var payload=await fetchCloudPayload(cfg)||{},orders=Array.isArray(payload.orders)?payload.orders.slice():[];if(!orders.some(function(x){return x&&x.id===order.id}))orders.push(order);payload.orders=orders;await upsertCloudPayload(cfg,payload);return true}
async function submitOrderToPanels(order){var saved=false;if(cloudReady(CLOUD_ADMIN)){await appendOrderToCloud(CLOUD_ADMIN,order);saved=true}if(cloudReady(CLOUD_PUBLIC)){try{await appendOrderToCloud(CLOUD_PUBLIC,order);if(!cloudReady(CLOUD_ADMIN))saved=true}catch(err){if(!saved)throw err}}return saved}
async function loadCatalog(force){
  if(!cloudReady(CLOUD_PUBLIC))return false;
  if(catalogBusy&&!force)return false;
  catalogBusy=true;
  try{
    var res=await fetch(cloudRowUrl(CLOUD_PUBLIC),{method:"GET",headers:cloudHeaders(CLOUD_PUBLIC)});
    if(!res.ok)throw new Error("HTTP "+res.status);
    var raw=await res.json(),row=raw&&raw[0]||null,payload=row&&row.payload||null;
    if(!payload)return false;
    var updated=String(row&&row.updated_at||"");
    if(!force&&updated&&updated===lastRemoteUpdatedAt)return false;
    lastRemoteUpdatedAt=updated||lastRemoteUpdatedAt;
    if(payload.wa!=null)WA=payload.wa||"";
    if(payload.logo!=null)LOGO=payload.logo||"";
    if(payload.customers!=null)CUSTOMERS=payload.customers||[];
    if(payload.data!=null)DATA=payload.data||{};
    renderLogo();autofill(true);renderGroups();renderTypes();renderProducts();renderCart();
    return true;
  }catch(e){
    return false;
  }finally{
    catalogBusy=false;
  }
}
function startCatalogLiveSync(){
  clearInterval(catalogTimer);
  catalogTimer=window.setInterval(function(){loadCatalog(false);},document.hidden?2500:800);
}
function saveForm(){try{localStorage.setItem("astera_cf",JSON.stringify({ph:g("custPhone").value,nm:g("custName").value,fm:g("custFirm").value,inv:g("wantInvoice").checked,tn:g("custTaxNo").value,td:g("custTaxOffice").value}))}catch(e){}}function loadForm(){try{var d=JSON.parse(localStorage.getItem("astera_cf")||"{}");if(d.ph)g("custPhone").value=d.ph;if(d.inv)g("wantInvoice").checked=true;if(d.tn)g("custTaxNo").value=d.tn;if(d.td)g("custTaxOffice").value=d.td}catch(e){}g("custPhone").value=normalizePhone(g("custPhone").value||"");if(g("custPhone").value){try{var d2=JSON.parse(localStorage.getItem("astera_cf")||"{}");if(d2.nm)g("custName").value=d2.nm;if(d2.fm)g("custFirm").value=d2.fm}catch(e){}}else{g("custName").value="";g("custFirm").value="";g("custTaxNo").value="";g("custTaxOffice").value=""}toggleInvoice()}
function autofill(force){g("custPhone").value=normalizePhone(g("custPhone").value||"");if(!g("custPhone").value){g("custName").value="";g("custFirm").value="";g("custTaxNo").value="";g("custTaxOffice").value="";renderCart();saveForm();return}var c=currentCustomer();if(!c){if(force){g("custName").value="";g("custFirm").value=""}renderCart();saveForm();return}if(force||!g("custName").value)g("custName").value=c.ad||"";if(force||!g("custFirm").value)g("custFirm").value=c.firma||c.ad||"";if(c.vergiNo&&(force||!g("custTaxNo").value))g("custTaxNo").value=c.vergiNo;if(c.vergiDairesi&&(force||!g("custTaxOffice").value))g("custTaxOffice").value=c.vergiDairesi;saveForm();renderCart()}
function toggleInvoice(){var open=g("wantInvoice").checked,wrap=g("invoiceFields");wrap.className="invoice-grid"+(open?" open":"");["custTaxNo","custTaxOffice"].forEach(function(id){var el=g(id);el.disabled=!open;el.required=open});renderCart()}
function firstTypeWithProducts(groupKey){var cats=(DATA[groupKey]&&DATA[groupKey].cats)||{},keys=Object.keys(cats);return keys.find(function(t){return (cats[t]||[]).length>0})||keys[0]||""}
function renderLogo(){g("logoArea").innerHTML=LOGO?"<img src='"+LOGO+"' alt='Logo'>":"<div class='logo-fb'>A</div>"}function renderGroups(){var keys=Object.keys(DATA||{});if((!activeGroup||keys.indexOf(activeGroup)<0)&&keys.length)activeGroup=keys[0];var groupCats=Object.keys((DATA[activeGroup]&&DATA[activeGroup].cats)||{});if((!activeType||groupCats.indexOf(activeType)<0)&&activeGroup)activeType=firstTypeWithProducts(activeGroup);var el=g("groupTabs");if(!keys.length){el.innerHTML="<div class='empty-msg'>Grup bulunamadi.</div>";return}el.innerHTML=keys.map(function(k){var count=Object.keys((DATA[k]&&DATA[k].cats)||{}).reduce(function(sum,t){return sum+(((DATA[k].cats||{})[t]||[]).length||0);},0);return "<button class='tab"+(k===activeGroup?" active":"")+"' data-group='"+enc(k)+"'>"+((DATA[k]&&DATA[k].label)||k)+(count?" ("+count+")":"")+"</button>"}).join("");Array.prototype.forEach.call(el.querySelectorAll("[data-group]"),function(btn){btn.onclick=function(){activeGroup=dec(this.dataset.group);activeType=firstTypeWithProducts(activeGroup);renderGroups();renderTypes();renderProducts()}})}
function renderTypes(){var cats=Object.keys((DATA[activeGroup]&&DATA[activeGroup].cats)||{});if((!activeType||cats.indexOf(activeType)<0)&&cats.length)activeType=firstTypeWithProducts(activeGroup);var el=g("typeTabs");el.innerHTML=cats.map(function(type){var count=((DATA[activeGroup]&&DATA[activeGroup].cats&&DATA[activeGroup].cats[type])||[]).length;return "<button class='tab"+(type===activeType?" active":"")+"' data-type='"+enc(type)+"'>"+type+(count?" ("+count+")":"")+"</button>"}).join("");Array.prototype.forEach.call(el.querySelectorAll("[data-type]"),function(btn){btn.onclick=function(){activeType=dec(this.dataset.type);renderTypes();renderProducts()}})}
function filteredProducts(){var q=(g("search").value||"").toLowerCase().trim(),list=q?allProducts():(((DATA[activeGroup]&&DATA[activeGroup].cats&&DATA[activeGroup].cats[activeType])||[]).map(function(p){return Object.assign({},p,{groupKey:activeGroup,groupLabel:(DATA[activeGroup]&&DATA[activeGroup].label)||activeGroup,type:activeType})}));if(q)list=list.filter(function(p){return [p.name,p.mann,p.oem,p.modeller,p.groupLabel,p.type].join(" ").toLowerCase().indexOf(q)>=0});return list}
function setQty(id,qty){qty=Math.max(0,parseInt(qty,10)||0);var p=allProducts().find(function(x){return x.id===id});if(!p)return;if(qty===0)delete cart[id];else cart[id]={product:p,qty:qty};renderProducts();renderCart()}
function askTermin(id){var p=allProducts().find(function(x){return x.id===id});if(p&&WA)window.open("https://wa.me/"+WA+"?text="+encodeURIComponent("Merhaba, "+(p.mann||"urun")+" icin termin tarihi alabilir miyim?"),"_blank")}
function renderProducts(){var products=filteredProducts(),el=g("products");if(!products.length){el.innerHTML="<div class='empty-msg'>Urun bulunamadi.</div>";return}el.innerHTML=products.map(function(p){var qty=cart[p.id]?cart[p.id].qty:0,inStock=p.stock!==false&&(p.stokAdet==null||p.stokAdet>0);return "<div class='product"+(inStock?"":" out")+"'><div class='prod-img-wrap'>"+(p.img?"<img src='"+p.img+"' alt='' loading='lazy'>":"<span class='prod-img-placeholder'>A</span>")+"</div><div class='prod-name'>"+(p.name||"")+"</div><div class='prod-meta'><div><strong>MANN:</strong> "+(p.mann||"-")+"</div><div><strong>OEM:</strong> "+(p.oem||"-")+"</div>"+(p.modeller?"<div><strong>Arac:</strong> "+String(p.modeller).substring(0,50)+"</div>":"")+"</div><div class='"+(inStock?"stock-ok":"stock-out")+"'>"+(inStock?"Stok Var":"Stok Yok")+"</div><div class='prod-price'>"+money(p.price||0)+"<small>KDV Haric</small></div>"+(inStock?"<div class='qty-row'><input class='qty-input' type='number' min='0' value='"+qty+"' data-qty='"+enc(p.id)+"'><button class='btn btn-brand' data-add='"+enc(p.id)+"'>Sepete Ekle</button></div>":"<div class='qty-row'><button class='btn btn-termin' data-termin='"+enc(p.id)+"'>Termin Sor</button></div>")+"</div>"}).join("");Array.prototype.forEach.call(el.querySelectorAll("[data-qty]"),function(inp){inp.onchange=function(){setQty(dec(this.dataset.qty),this.value)}});Array.prototype.forEach.call(el.querySelectorAll("[data-add]"),function(btn){btn.onclick=function(){var id=dec(this.dataset.add);setQty(id,(cart[id]?cart[id].qty:0)+1)}});Array.prototype.forEach.call(el.querySelectorAll("[data-termin]"),function(btn){btn.onclick=function(){var p=allProducts().find(function(x){return x.id===dec(btn.dataset.termin)});if(p&&WA)window.open("https://wa.me/"+WA+"?text="+encodeURIComponent("Merhaba, "+(p.mann||"urun")+" icin termin tarihi alabilir miyim?"),"_blank")}})}
function renderCart(){var ids=Object.keys(cart),totals=orderTotals();g("cartCount").textContent=ids.length+" urun";if(!ids.length){g("cartList").innerHTML="<div class='cart-empty'>Sepetiniz bos.</div>";g("subRow").style.display="none";g("discountRow").style.display="none";g("discountedSubRow").style.display="none";g("vatRow").style.display="none";g("cartTotal").textContent="0,00 TL";return}g("cartList").innerHTML=ids.map(function(id){var item=cart[id],line=(item.product.price||0)*item.qty;return "<div class='cart-item'><div class='cart-item-name'>"+(item.product.mann||"")+"</div><div class='cart-item-sub'>"+String(item.product.name||"").substring(0,40)+"</div><div class='cart-item-sub'>"+item.qty+" adet x "+money(item.product.price||0)+"</div><div class='cart-item-row'><span class='cart-item-price'>"+money(line)+"</span><button class='btn-remove' data-remove='"+enc(id)+"'>x</button></div></div>"}).join("");g("subRow").style.display="flex";g("cartSubtotal").textContent=money(totals.subtotal);g("discountRow").style.display=totals.discountRate>0?"flex":"none";g("discountedSubRow").style.display=totals.discountRate>0?"flex":"none";g("cartDiscountLabel").textContent="Ozel Iskonto (%"+totals.discountRate.toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+")";g("cartDiscount").textContent="-"+money(totals.discount);g("cartDiscountedSubtotal").textContent=money(totals.discountedSubtotal);g("vatRow").style.display=g("wantInvoice").checked?"flex":"none";g("cartVat").textContent=money(totals.vat);g("cartTotal").textContent=money(totals.total);Array.prototype.forEach.call(g("cartList").querySelectorAll("[data-remove]"),function(btn){btn.onclick=function(){setQty(dec(this.dataset.remove),0)}})}
function buildMessage(){var ids=Object.keys(cart),inv=g("wantInvoice").checked,totals=orderTotals(),msg="ASTERA YENI SIPARIS\n";msg+="Tarih: "+new Date().toLocaleDateString("tr-TR")+"\n";msg+="Musteri: "+(g("custName").value||g("custFirm").value||"Belirtilmedi")+"\n";if(g("custPhone").value)msg+="Cari Kod / Telefon: "+g("custPhone").value+"\n";if(g("custFirm").value)msg+="Firma: "+g("custFirm").value+"\n";if(inv){msg+="Fatura: Evet\n";if(g("custTaxNo").value)msg+="Vergi No: "+g("custTaxNo").value+"\n";if(g("custTaxOffice").value)msg+="Vergi Dairesi: "+g("custTaxOffice").value+"\n"}msg+="-------------------------\n";ids.forEach(function(id){var item=cart[id],line=(item.product.price||0)*item.qty;msg+=item.product.mann+" x "+item.qty+" = "+money(line)+"\n"});msg+="-------------------------\n";msg+="Ara Toplam: "+money(totals.subtotal)+"\n";if(totals.discountRate>0){msg+="Ozel Iskonto (%"+totals.discountRate.toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+"): -"+money(totals.discount)+"\n";msg+="Iskontolu Ara Toplam: "+money(totals.discountedSubtotal)+"\n"}if(inv)msg+="KDV %20: "+money(totals.vat)+"\n";msg+="GENEL TOPLAM: "+money(totals.total);return msg}
function makeOrderPayload(){var ids=Object.keys(cart),totals=orderTotals(),customer=totals.customer;return {id:uid(),tarih:new Date().toISOString(),musteri:g("custName").value||g("custFirm").value||"Belirtilmedi",firma:g("custFirm").value||"",telefon:normalizePhone(g("custPhone").value||""),vergiNo:g("custTaxNo").value||"",vergiDairesi:g("custTaxOffice").value||"",fatura:!!g("wantInvoice").checked,iskontoOrani:totals.discountRate||0,iskontoTutari:totals.discount||0,araToplam:totals.subtotal||0,iskontoluAraToplam:totals.discountedSubtotal||0,kdv:totals.vat||0,toplam:totals.total||0,kaynak:"customer_panel",musteriKartId:customer&&customer.id||"",items:ids.map(function(id){var item=cart[id],qty=parseInt(item.qty,10)||0,price=parseFloat(item.product&&item.product.price||0)||0;return {id:item.product&&item.product.id||"",mann:item.product&&item.product.mann||"",name:item.product&&item.product.name||"",oem:item.product&&item.product.oem||"",qty:qty,fiyat:price,toplam:qty*price}})}}
function sendOrder(){if(!Object.keys(cart).length){alert("Once urun ekleyin.");return}if(!WA){alert("WhatsApp numarasi tanimli degil.");return}if(!g("custName").value&&!g("custFirm").value&&!g("custPhone").value){if(!confirm("Musteri bilgisi girilmedi. Yine de gondermek istiyor musunuz?"))return}var order=makeOrderPayload(),btn=g("sendBtn"),oldText=btn.textContent;btn.disabled=true;btn.textContent="Siparis kaydediliyor...";submitOrderToPanels(order).then(function(saved){if(!saved&&cloudReady(CLOUD_ADMIN))throw new Error("Bulut baglantisi bulunamadi");window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(buildMessage()),"_blank");cart={};renderProducts();renderCart()}).catch(function(err){var msg=(err&&err.message)||"Siparis panel kaydi basarisiz oldu.";if(confirm(msg+" Yine de WhatsApp acilsin mi?"))window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(buildMessage()),"_blank")}).finally(function(){btn.disabled=false;btn.textContent=oldText})}
window.onload=function(){renderLogo();loadForm();autofill(true);renderGroups();renderTypes();renderProducts();renderCart();g("search").oninput=renderProducts;g("custPhone").oninput=function(){autofill(true);saveForm()};g("custName").oninput=saveForm;g("custFirm").oninput=saveForm;g("custTaxNo").oninput=saveForm;g("custTaxOffice").oninput=saveForm;g("wantInvoice").onchange=function(){toggleInvoice();saveForm()};g("sendBtn").onclick=sendOrder;loadCatalog(true);startCatalogLiveSync();document.addEventListener("visibilitychange",function(){startCatalogLiveSync();if(!document.hidden)loadCatalog(true)});window.addEventListener("focus",function(){loadCatalog(true)});window.addEventListener("pageshow",function(){loadCatalog(true);startCatalogLiveSync();});}
